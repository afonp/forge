name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install cross-compilation tools (linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: build
        run: cargo build --release --target ${{ matrix.target }}

      - name: strip binary (unix)
        if: matrix.os != 'windows-latest' && matrix.target != 'aarch64-unknown-linux-gnu'
        run: strip target/${{ matrix.target }}/release/forge

      - name: strip binary (linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: aarch64-linux-gnu-strip target/${{ matrix.target }}/release/forge

      - name: package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../forge-${{ matrix.target }}.tar.gz forge
          cd ../../..

      - name: package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/forge.exe -DestinationPath forge-${{ matrix.target }}.zip

      - name: create windows installer
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $installerDir = "installer"
          New-Item -ItemType Directory -Force -Path $installerDir

          # create inno setup script
          @"
          [Setup]
          AppName=forge
          AppVersion=$version
          AppPublisher=afonp
          AppPublisherURL=https://github.com/afonp/forge
          DefaultDirName={autopf}\forge
          DefaultGroupName=forge
          OutputDir=.
          OutputBaseFilename=forge-${{ matrix.target }}-setup
          Compression=lzma
          SolidCompression=yes
          ChangesEnvironment=yes
          PrivilegesRequired=lowest

          [Files]
          Source: "target\${{ matrix.target }}\release\forge.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Registry]
          Root: HKCU; Subkey: "Environment"; ValueType: expandsz; ValueName: "Path"; ValueData: "{olddata};{app}"; Check: NeedsAddPath('{app}')

          [Code]
          function NeedsAddPath(Param: string): boolean;
          var
            OrigPath: string;
          begin
            if not RegQueryStringValue(HKEY_CURRENT_USER, 'Environment', 'Path', OrigPath) then
            begin
              Result := True;
              exit;
            end;
            Result := Pos(';' + Param + ';', ';' + OrigPath + ';') = 0;
          end;
          "@ | Out-File -FilePath "$installerDir\forge.iss" -Encoding UTF8

          # install inno setup
          choco install innosetup --yes --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "$installerDir\forge.iss"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-${{ matrix.target }}
          path: forge-${{ matrix.target }}.${{ matrix.archive }}

      - name: upload installer
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@v4
        with:
          name: forge-${{ matrix.target }}-setup
          path: forge-${{ matrix.target }}-setup.exe

  publish-crate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: compute checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.exe" \) -exec sha256sum {} \; | sort > ../checksums.txt
          cd ..

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*
            checksums.txt
          body: |
            ## install

            ### cargo
            ```
            cargo install forge-cp
            ```

            ### homebrew (macos/linux)
            ```
            brew tap afonp/tap
            brew install forge
            ```

            ### winget (windows)
            ```
            winget install afonp.forge
            ```

            ### windows installer
            download `forge-x86_64-pc-windows-msvc-setup.exe` from the assets below and run it. it adds `forge` to your PATH automatically.

            ### download binary
            download the archive for your platform from the assets below, extract it, and place the `forge` binary in your `$PATH`.

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: update homebrew tap
        uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: forge
          homebrew-tap: afonp/homebrew-tap
          download-url: https://github.com/afonp/forge/releases/download/${{ github.ref_name }}/forge-x86_64-apple-darwin.tar.gz
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  update-winget:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: afonp.forge
          installers-regex: 'forge-x86_64-pc-windows-msvc-setup\.exe'
          token: ${{ secrets.WINGET_TOKEN }}
